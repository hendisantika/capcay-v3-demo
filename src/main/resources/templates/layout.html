<!DOCTYPE html>
<html lang="en" th:fragment="layout (title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:replace="${title}">Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" th:if="${recaptchaSiteKey}"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/products">
            <i class="fas fa-box"></i> Product Management
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/products">
                <i class="fas fa-list"></i> Products
            </a>
            <a class="nav-link" href="/products/new">
                <i class="fas fa-plus"></i> Add Product
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <main th:replace="${content}">
        Content will be replaced
    </main>
</div>

<footer class="bg-light text-center text-muted py-3 mt-5">
    <div class="container">
        <p>&copy; 2024 Product Management System. Powered by Spring Boot & reCAPTCHA v3.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
