<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Product: ' + ${product.name} + ' - Product Management'">Product Details - Product
        Management</title>
</head>
<body>
<main th:fragment="main">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3><i class="fas fa-eye"></i> Product Details</h3>
                    <div>
                        <a class="btn btn-warning btn-sm" th:href="@{'/products/' + ${product.id} + '/edit'}">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <button class="btn btn-danger btn-sm" data-bs-target="#deleteModal" data-bs-toggle="modal"
                                type="button">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <table class="table table-borderless">
                                <tr>
                                    <th width="30%">ID:</th>
                                    <td th:text="${product.id}"></td>
                                </tr>
                                <tr>
                                    <th>Name:</th>
                                    <td><strong th:text="${product.name}"></strong></td>
                                </tr>
                                <tr>
                                    <th>Category:</th>
                                    <td>
                                        <span class="badge bg-secondary" th:if="${product.category}"
                                              th:text="${product.category}"></span>
                                        <span class="text-muted" th:unless="${product.category}">No category</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>Price:</th>
                                    <td class="text-success">
                                        <strong th:text="'$' + ${#numbers.formatDecimal(product.price, 0, 2)}"></strong>
                                    </td>
                                </tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <table class="table table-borderless">
                                <tr>
                                    <th width="40%">Stock Quantity:</th>
                                    <td>
                                            <span th:classappend="${product.stockQuantity <= 0} ? 'text-danger' : (${product.stockQuantity <= 10} ? 'text-warning' : 'text-success')"
                                                  th:text="${product.stockQuantity}"></span>
                                        <span class="badge bg-danger ms-2" th:if="${product.stockQuantity <= 0}">Out of Stock</span>
                                        <span class="badge bg-warning ms-2"
                                              th:if="${product.stockQuantity > 0 && product.stockQuantity <= 10}">Low Stock</span>
                                        <span class="badge bg-success ms-2" th:if="${product.stockQuantity > 10}">In Stock</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>Created:</th>
                                    <td th:text="${#temporals.format(product.createdAt, 'MMM dd, yyyy HH:mm')}"></td>
                                </tr>
                                <tr>
                                    <th>Last Updated:</th>
                                    <td th:text="${#temporals.format(product.updatedAt, 'MMM dd, yyyy HH:mm')}"></td>
                                </tr>
                            </table>
                        </div>
                    </div>

                    <div class="mt-3" th:if="${product.description}">
                        <h6>Description:</h6>
                        <div class="border rounded p-3 bg-light">
                            <p class="mb-0" th:text="${product.description}"></p>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <a class="btn btn-secondary" href="/products">
                        <i class="fas fa-arrow-left"></i> Back to List
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete the product "<strong th:text="${product.name}"></strong>"?
                    This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                    <form id="deleteForm" method="post" style="display: inline;"
                          th:action="@{'/products/' + ${product.id} + '/delete'}">
                        <div id="recaptcha-container"></div>
                        <button class="btn btn-danger" type="submit">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:if="${recaptchaSiteKey}" th:inline="javascript">
        /*<![CDATA[*/
        var recaptchaSiteKey = /*[[${recaptchaSiteKey}]]*/ '';
        var recaptchaId;

        function onRecaptchaLoad() {
            recaptchaId = grecaptcha.render('recaptcha-container', {
                'sitekey': recaptchaSiteKey,
                'size': 'invisible',
                'callback': function (token) {
                    var form = document.getElementById('deleteForm');
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'g-recaptcha-response';
                    input.value = token;
                    form.appendChild(input);
                    form.submit();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (typeof grecaptcha !== 'undefined') {
                onRecaptchaLoad();
            } else {
                window.onRecaptchaLoad = onRecaptchaLoad;
            }

            document.getElementById('deleteForm').addEventListener('submit', function (e) {
                e.preventDefault();
                grecaptcha.execute(recaptchaId);
            });
        });
        /*]]>*/
    </script>
</main>
</body>
</html>
