<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Product - Product Management</title>
</head>
<body>
<main th:fragment="main">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-plus"></i> Add New Product</h3>
                </div>
                <div class="card-body">
                    <form id="productForm" method="post" th:action="@{/products}" th:object="${product}">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="name">Product Name *</label>
                                <input class="form-control" id="name" required th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       th:field="*{name}" type="text">
                                <div class="invalid-feedback" th:errors="*{name}"
                                     th:if="${#fields.hasErrors('name')}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="category">Category</label>
                                <input class="form-control" id="category" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" th:field="*{category}"
                                       type="text">
                                <div class="invalid-feedback" th:errors="*{category}"
                                     th:if="${#fields.hasErrors('category')}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-control" id="description" rows="3" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                      th:field="*{description}"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"
                                 th:if="${#fields.hasErrors('description')}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="price">Price ($) *</label>
                                <input class="form-control" id="price" min="0" required step="0.01"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                       th:field="*{price}" type="number">
                                <div class="invalid-feedback" th:errors="*{price}"
                                     th:if="${#fields.hasErrors('price')}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="stockQuantity">Stock Quantity *</label>
                                <input class="form-control" id="stockQuantity" min="0" required
                                       th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''"
                                       th:field="*{stockQuantity}"
                                       type="number">
                                <div class="invalid-feedback" th:errors="*{stockQuantity}"
                                     th:if="${#fields.hasErrors('stockQuantity')}"></div>
                            </div>
                        </div>

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <ul class="mb-0">
                                <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                            </ul>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">reCAPTCHA Verification</label>
                            <div class="border rounded p-3 bg-light text-center" id="recaptcha-container">
                                <small class="text-muted">Please complete the reCAPTCHA verification</small>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" href="/products">
                                <i class="fas fa-arrow-left"></i> Back to List
                            </a>
                            <button class="btn btn-primary" id="submitBtn" type="submit">
                                <i class="fas fa-save"></i> Create Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:if="${recaptchaSiteKey}" th:inline="javascript">
        /*<![CDATA[*/
        var recaptchaSiteKey = /*[[${recaptchaSiteKey}]]*/ '';
        var recaptchaId;
        var isRecaptchaVerified = false;

        function onRecaptchaLoad() {
            recaptchaId = grecaptcha.render('recaptcha-container', {
                'sitekey': recaptchaSiteKey,
                'size': 'normal',
                'theme': 'light',
                'callback': function (token) {
                    isRecaptchaVerified = true;
                    console.log('reCAPTCHA verified successfully');

                    // Add hidden input for the token
                    var existingInput = document.querySelector('input[name="g-recaptcha-response"]');
                    if (existingInput) {
                        existingInput.value = token;
                    } else {
                        var form = document.getElementById('productForm');
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'g-recaptcha-response';
                        input.value = token;
                        form.appendChild(input);
                    }

                    // Enable submit button
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Create Product';
                },
                'expired-callback': function () {
                    isRecaptchaVerified = false;
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Complete reCAPTCHA to Continue';
                    console.log('reCAPTCHA expired');
                },
                'error-callback': function () {
                    isRecaptchaVerified = false;
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> reCAPTCHA Error - Refresh Page';
                    console.log('reCAPTCHA error');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Initially disable submit button
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Complete reCAPTCHA to Continue';

            if (typeof grecaptcha !== 'undefined') {
                onRecaptchaLoad();
            } else {
                window.onload = function () {
                    onRecaptchaLoad();
                };
            }

            document.getElementById('productForm').addEventListener('submit', function (e) {
                if (!isRecaptchaVerified) {
                    e.preventDefault();
                    alert('Please complete the reCAPTCHA verification before submitting.');
                    return false;
                }

                if (!this.checkValidity()) {
                    e.preventDefault();
                    this.reportValidity();
                    return false;
                }

                return true;
            });
        });
        /*]]>*/
    </script>
</main>
</body>
</html>
