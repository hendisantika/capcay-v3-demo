<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Product - Product Management</title>
</head>
<body>
<main th:fragment="main">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-plus"></i> Add New Product</h3>
                </div>
                <div class="card-body">
                    <form id="productForm" method="post" th:action="@{/products}" th:object="${product}">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="name">Product Name *</label>
                                <input class="form-control" id="name" required th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       th:field="*{name}" type="text">
                                <div class="invalid-feedback" th:errors="*{name}"
                                     th:if="${#fields.hasErrors('name')}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="category">Category</label>
                                <input class="form-control" id="category" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" th:field="*{category}"
                                       type="text">
                                <div class="invalid-feedback" th:errors="*{category}"
                                     th:if="${#fields.hasErrors('category')}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-control" id="description" rows="3" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                      th:field="*{description}"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"
                                 th:if="${#fields.hasErrors('description')}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="price">Price ($) *</label>
                                <input class="form-control" id="price" min="0" required step="0.01"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                       th:field="*{price}" type="number">
                                <div class="invalid-feedback" th:errors="*{price}"
                                     th:if="${#fields.hasErrors('price')}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="stockQuantity">Stock Quantity *</label>
                                <input class="form-control" id="stockQuantity" min="0" required
                                       th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''"
                                       th:field="*{stockQuantity}"
                                       type="number">
                                <div class="invalid-feedback" th:errors="*{stockQuantity}"
                                     th:if="${#fields.hasErrors('stockQuantity')}"></div>
                            </div>
                        </div>

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <ul class="mb-0">
                                <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                            </ul>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" href="/products">
                                <i class="fas fa-arrow-left"></i> Back to List
                            </a>
                            <button class="btn btn-primary" id="submitBtn" type="submit">
                                <i class="fas fa-save"></i> Create Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:if="${recaptchaSiteKey}" th:inline="javascript">
        /*<![CDATA[*/
        var recaptchaSiteKey = /*[[${recaptchaSiteKey}]]*/ '';

        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('productForm');
            var submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                if (!this.checkValidity()) {
                    this.reportValidity();
                    return false;
                }

                // Disable submit button to prevent double submission
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

                // Execute reCAPTCHA v3
                grecaptcha.ready(function () {
                    grecaptcha.execute(recaptchaSiteKey, {action: 'create_product'}).then(function (token) {
                        // Add the token to the form
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'g-recaptcha-response';
                        input.value = token;
                        form.appendChild(input);

                        // Submit the form
                        form.submit();
                    }).catch(function (error) {
                        console.error('reCAPTCHA error:', error);
                        alert('reCAPTCHA verification failed. Please refresh the page and try again.');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-save"></i> Create Product';
                    });
                });

                return false;
            });
        });
        /*]]>*/
    </script>
    <script th:inline="javascript"
            th:src="'https://www.google.com/recaptcha/api.js?render=' + ${recaptchaSiteKey}"></script>
</main>
</body>
</html>
