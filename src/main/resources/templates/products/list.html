<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product List - Product Management</title>
</head>
<body>
<main th:fragment="main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-box"></i> Products</h1>
        <a class="btn btn-primary" href="/products/new">
            <i class="fas fa-plus"></i> Add New Product
        </a>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <form action="/products" class="d-flex" method="get">
                <input class="form-control" name="search" placeholder="Search products..." th:value="${search}"
                       type="text"/>
                <button class="btn btn-outline-secondary ms-2" type="submit">
                    <i class="fas fa-search"></i>
                </button>
                <a class="btn btn-outline-secondary ms-1" href="/products" th:if="${search}">
                    <i class="fas fa-times"></i>
                </a>
            </form>
        </div>
        <div class="col-md-6 text-end">
            <span class="text-muted" th:text="'Total: ' + ${products.size()} + ' product(s)'"></span>
        </div>
    </div>

    <div class="alert alert-info text-center" th:if="${products.empty}">
        <i class="fas fa-info-circle"></i> No products found.
        <a class="btn btn-primary ms-2" href="/products/new">Add First Product</a>
    </div>

    <div class="table-responsive" th:unless="${products.empty}">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td>
                    <a class="text-decoration-none" th:href="@{'/products/' + ${product.id}}"
                       th:text="${product.name}"></a>
                </td>
                <td>
                    <span class="badge bg-secondary" th:if="${product.category}" th:text="${product.category}"></span>
                    <span class="text-muted" th:unless="${product.category}">-</span>
                </td>
                <td>
                    <strong th:text="'$' + ${#numbers.formatDecimal(product.price, 0, 2)}"></strong>
                </td>
                <td>
                            <span th:classappend="${product.stockQuantity <= 0} ? 'text-danger' : (${product.stockQuantity <= 10} ? 'text-warning' : 'text-success')"
                                  th:text="${product.stockQuantity}"></span>
                </td>
                <td th:text="${#temporals.format(product.createdAt, 'MMM dd, yyyy')}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a class="btn btn-sm btn-outline-info" th:href="@{'/products/' + ${product.id}}" title="View">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a class="btn btn-sm btn-outline-warning" th:href="@{'/products/' + ${product.id} + '/edit'}"
                           title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${product.id}"
                                title="Delete" type="button">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>

                    <!-- Delete Modal -->
                    <div class="modal fade" tabindex="-1" th:id="'deleteModal' + ${product.id}">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Confirm Delete</h5>
                                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                                </div>
                                <div class="modal-body">
                                    Are you sure you want to delete the product "<strong
                                        th:text="${product.name}"></strong>"?
                                    This action cannot be undone.
                                </div>
                                <div class="modal-footer">
                                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel
                                    </button>
                                    <form method="post" style="display: inline;"
                                          th:action="@{'/products/' + ${product.id} + '/delete'}">
                                        <div th:id="'recaptcha' + ${product.id}"></div>
                                        <button class="btn btn-danger" type="submit">Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script th:if="${recaptchaSiteKey}" th:inline="javascript">
        /*<![CDATA[*/
        var recaptchaSiteKey = /*[[${recaptchaSiteKey}]]*/ '';

        function onRecaptchaLoad() {
            var products = /*[[${products}]]*/ [];
            products.forEach(function (product) {
                if (document.getElementById('recaptcha' + product.id)) {
                    grecaptcha.render('recaptcha' + product.id, {
                        'sitekey': recaptchaSiteKey,
                        'size': 'invisible',
                        'callback': function (token) {
                            var form = document.getElementById('recaptcha' + product.id).closest('form');
                            var input = document.createElement('input');
                            input.type = 'hidden';
                            input.name = 'g-recaptcha-response';
                            input.value = token;
                            form.appendChild(input);
                            form.submit();
                        }
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (typeof grecaptcha !== 'undefined') {
                onRecaptchaLoad();
            } else {
                window.onRecaptchaLoad = onRecaptchaLoad;
            }

            document.querySelectorAll('form[action*="/delete"]').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var recaptchaDiv = form.querySelector('[id^="recaptcha"]');
                    var recaptchaId = recaptchaDiv.id.replace('recaptcha', '');
                    grecaptcha.execute(grecaptcha.getClient(recaptchaDiv));
                });
            });
        });
        /*]]>*/
    </script>
</main>
</body>
</html>
